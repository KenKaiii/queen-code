name: Build macOS (Unsigned)

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build macOS ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build native
        env:
          CI: true
        run: bun run tauri build

      - name: Upload architecture-specific artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 1

  universal:
    name: Create Universal Binary
    needs: [build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "📁 Artifact structure:"
          find artifacts -type f

      - name: Create universal app
        run: |
          mkdir -p dmg_temp

          AARCH64_APP=$(find artifacts/macos-aarch64 -name "*.app" -type d | head -1)
          X86_64_APP=$(find artifacts/macos-x86_64 -name "*.app" -type d | head -1)

          if [ -z "$AARCH64_APP" ] || [ -z "$X86_64_APP" ]; then
            echo "❌ Could not find app bundles"
            exit 1
          fi

          echo "✅ Found app bundles:"
          echo "  ARM64: $AARCH64_APP"
          echo "  x86_64: $X86_64_APP"

          cp -R "$AARCH64_APP" dmg_temp/
          APP_NAME=$(basename "$AARCH64_APP")

          lipo -create -output "dmg_temp/$APP_NAME/Contents/MacOS/queen-code" \
            "$AARCH64_APP/Contents/MacOS/queen-code" \
            "$X86_64_APP/Contents/MacOS/queen-code"

          chmod +x "dmg_temp/$APP_NAME/Contents/MacOS/queen-code"

          echo "✅ Universal binary created"
          lipo -info "dmg_temp/$APP_NAME/Contents/MacOS/queen-code"

      - name: Create DMG
        run: |
          hdiutil create -volname "Queen Code Installer" \
            -srcfolder dmg_temp \
            -ov -format UDZO queen-code.dmg

      - name: Create artifacts directory
        run: |
          mkdir -p dist/macos-universal
          cp queen-code.dmg dist/macos-universal/

          ditto -c -k --sequesterRsrc --keepParent \
            dmg_temp/*.app dist/macos-universal/queen-code.app.zip

          shasum -a 256 dist/macos-universal/* > dist/macos-universal/checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/macos-universal/*